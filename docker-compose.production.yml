volumes:
  db-data:

services:
  server:
    build:
      context: .
      target: production # Stage "production"
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ht-api.entrypoints=websecure-external"
      - "traefik.http.routers.ht-api.rule=Host(`ht.${DOMAIN}`)"
      - "traefik.http.services.server.loadbalancer.server.port=${APPLICATION_PORT}"
    networks:
      - proxy_net
      - internal
  db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 5432:${DB_PORT}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
  redis:
    image: redis:7.4.1
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes"
    ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 6379:${REDIS_PORT}
    volumes:
      - redis-data:/data
    networks:
      - internal

networks:
  internal:
  proxy_net:
    external: true